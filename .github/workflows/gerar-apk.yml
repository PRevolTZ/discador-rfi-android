name: Gerar APK do Discador

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      APP_URL: https://discador-igor.netlify.app/
      APP_NOME: AGYWH DISCADOR
      APP_ID: br.com.rfi.discador
      VERSION_CODE: ${{ github.run_number }}
      TEM_CHAVE_LOJA: ${{ secrets.UPLOAD_PASS != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Montar projeto Android
        run: |
          set -e
          P=projeto
          J=$P/app/src/main/java/br/com/rfi/discador
          mkdir -p $J $P/app/src/main/res/values $P/app/src/main/res/xml

          cat > $P/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DiscadorRFI"
          include(":app")
          EOF

          cat > $P/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.9.1' apply false }
          EOF

          echo "android.useAndroidX=true" > $P/gradle.properties

          cat > $P/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def vc = (System.getenv("VERSION_CODE") ?: "1").toInteger()
          android {
              namespace 'br.com.rfi.discador'
              compileSdk 36
              defaultConfig {
                  applicationId System.getenv("APP_ID") ?: 'br.com.rfi.discador'
                  minSdk 24
                  targetSdk 36
                  versionCode vc
                  versionName "1.0.${vc}"
              }
              signingConfigs {
                  teste {
                      storeFile file("../../chaves/teste.jks")
                      storePassword "discador-teste"
                      keyAlias "teste"
                      keyPassword "discador-teste"
                  }
                  loja {
                      if (System.getenv("UPLOAD_JKS")) {
                          storeFile file(System.getenv("UPLOAD_JKS"))
                          storePassword System.getenv("UPLOAD_PASS")
                          keyAlias System.getenv("UPLOAD_ALIAS")
                          keyPassword System.getenv("UPLOAD_PASS")
                      }
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.teste }
                  release {
                      minifyEnabled false
                      signingConfig System.getenv("UPLOAD_JKS") ? signingConfigs.loja : signingConfigs.teste
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CALENDAR" />
              <uses-permission android:name="android.permission.WRITE_CALENDAR" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REORDER_TASKS" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <queries>
                  <package android:name="com.whatsapp" />
                  <package android:name="com.whatsapp.w4b" />
                  <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>
                  <intent><action android:name="android.intent.action.GET_CONTENT" /></intent>
              </queries>
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/Tema"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/res/values/strings.xml <<EOF
          <resources><string name="app_name">${APP_NOME}</string></resources>
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Tema" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:statusBarColor">#08246e</item>
                  <item name="android:navigationBarColor">#f3f6fb</item>
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
          </resources>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package br.com.rfi.discador;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ContentUris;
          import android.content.ContentValues;
          import android.content.SharedPreferences;
          import android.database.Cursor;
          import android.provider.CalendarContract;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;

          public class MainActivity extends Activity {
              private static final int PEDIDO_LIGAR = 9;
              private static final int PEDIDO_ARQUIVO = 7;
              private static final int PEDIDO_INICIO = 5;
              private WebView web;
              private String numeroPendente;
              private ValueCallback<Uri[]> arquivoCb;
              private String host;

              @Override
              protected void onCreate(Bundle estado) {
                  super.onCreate(estado);
                  String url = BuildConfigUrl.URL;
                  host = Uri.parse(url).getHost();
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(true);
                  s.setUserAgentString(s.getUserAgentString() + " DiscadorApp/1");
                  web.addJavascriptInterface(new Ponte(), "DiscadorApp");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                          return trata(r.getUrl().toString());
                      }
                      @Override
                      public void onPageFinished(WebView v, String u) {
                          v.evaluateJavascript(
                              "(function(){document.title='AGYWH DISCADOR';document.querySelectorAll('.brand').forEach(function(h){h.textContent='AGYWH ';var sp=document.createElement('span');sp.textContent='DISCADOR';h.appendChild(sp)});if(window.__app)return;window.__app=2;" +
                              "var c=HTMLAnchorElement.prototype.click;" +
                              "HTMLAnchorElement.prototype.click=function(){" +
                              "if(this.download&&/^blob:/.test(this.href)){var n=this.download;" +
                              "fetch(this.href).then(function(r){return r.blob()}).then(function(b){var f=new FileReader();f.onload=function(){DiscadorApp.salvar(n,f.result)};f.readAsDataURL(b)});return;}" +
                              "return c.apply(this,arguments)};})()", null);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (arquivoCb != null) arquivoCb.onReceiveValue(null);
                          arquivoCb = cb;
                          try {
                              Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                              i.addCategory(Intent.CATEGORY_OPENABLE);
                              i.setType("*/*");
                              startActivityForResult(Intent.createChooser(i, "Escolher arquivo"), PEDIDO_ARQUIVO);
                          } catch (Exception e) {
                              arquivoCb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  if (estado != null) web.restoreState(estado); else web.loadUrl(url);
                  java.util.List<String> faltam = new java.util.ArrayList<>();
                  for (String p : new String[]{Manifest.permission.CALL_PHONE, Manifest.permission.READ_CALENDAR, Manifest.permission.WRITE_CALENDAR, Manifest.permission.READ_PHONE_STATE, "android.permission.POST_NOTIFICATIONS"})
                      if (checkSelfPermission(p) != PackageManager.PERMISSION_GRANTED) faltam.add(p);
                  if (!faltam.isEmpty()) requestPermissions(faltam.toArray(new String[0]), PEDIDO_INICIO);
              }

              private long calendario() {
                  String[] cols = {CalendarContract.Calendars._ID, CalendarContract.Calendars.ACCOUNT_TYPE, CalendarContract.Calendars.IS_PRIMARY, CalendarContract.Calendars.CALENDAR_ACCESS_LEVEL};
                  long melhor = -1; int nota = -1;
                  try (Cursor c = getContentResolver().query(CalendarContract.Calendars.CONTENT_URI, cols, CalendarContract.Calendars.VISIBLE + "=1", null, null)) {
                      while (c != null && c.moveToNext()) {
                          if (c.getInt(3) < CalendarContract.Calendars.CAL_ACCESS_CONTRIBUTOR) continue;
                          int n = ("com.google".equals(c.getString(1)) ? 2 : 0) + (c.getInt(2) == 1 ? 1 : 0);
                          if (n > nota) { nota = n; melhor = c.getLong(0); }
                      }
                  } catch (Exception e) {}
                  return melhor;
              }

              private boolean trata(String u) {
                  if (u.startsWith("tel:")) { ligar(u.substring(4)); return true; }
                  if (u.startsWith("intent:")) {
                      try {
                          Intent i = Intent.parseUri(u, Intent.URI_INTENT_SCHEME);
                          try { startActivity(i); }
                          catch (ActivityNotFoundException e) {
                              String f = i.getStringExtra("browser_fallback_url");
                              if (f != null) abrirFora(f);
                          }
                      } catch (Exception e) { aviso("Não foi possível abrir o WhatsApp"); }
                      return true;
                  }
                  Uri x = Uri.parse(u);
                  if (("https".equals(x.getScheme()) || "http".equals(x.getScheme())) && host != null && host.equals(x.getHost())) return false;
                  abrirFora(u);
                  return true;
              }

              private void abrirFora(String u) {
                  try { startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(u))); }
                  catch (Exception e) { aviso("Nenhum aplicativo para abrir este link"); }
              }

              private void ligar(String numero) {
                  String n = Uri.decode(numero).replaceAll("[^0-9+*#]", "");
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      try { startActivity(new Intent(Intent.ACTION_CALL, Uri.parse("tel:" + Uri.encode(n)))); vigiarLigacao(); }
                      catch (Exception e) { discar(n); }
                  } else {
                      numeroPendente = n;
                      requestPermissions(new String[]{Manifest.permission.CALL_PHONE}, PEDIDO_LIGAR);
                  }
              }

              private void discar(String n) {
                  try { startActivity(new Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(n)))); } catch (Exception e) {}
              }

              @Override
              public void onRequestPermissionsResult(int pedido, String[] perms, int[] res) {
                  super.onRequestPermissionsResult(pedido, perms, res);
                  if (pedido != PEDIDO_LIGAR || numeroPendente == null) return;
                  String n = numeroPendente; numeroPendente = null;
                  if (res.length > 0 && res[0] == PackageManager.PERMISSION_GRANTED) ligar(n);
                  else { aviso("Sem permissão de chamadas: abrindo o discador do celular"); discar(n); }
              }

              @Override
              protected void onActivityResult(int pedido, int resultado, Intent dados) {
                  super.onActivityResult(pedido, resultado, dados);
                  if (pedido == PEDIDO_ARQUIVO && arquivoCb != null) {
                      arquivoCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultado, dados));
                      arquivoCb = null;
                  }
              }

              private void aviso(String t) { runOnUiThread(() -> Toast.makeText(this, t, Toast.LENGTH_LONG).show()); }

              class Ponte {
                  @JavascriptInterface public boolean app() { return true; }
                  @JavascriptInterface public String contatos() {
                      if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) { runOnUiThread(() -> requestPermissions(new String[]{Manifest.permission.READ_CONTACTS}, PEDIDO_INICIO)); return "[]"; }
                      org.json.JSONArray a = new org.json.JSONArray();
                      try (Cursor c = getContentResolver().query(android.provider.ContactsContract.CommonDataKinds.Phone.CONTENT_URI, new String[]{android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME, android.provider.ContactsContract.CommonDataKinds.Phone.NUMBER}, null, null, android.provider.ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC")) {
                          while (c != null && c.moveToNext() && a.length() < 5000) { org.json.JSONObject o = new org.json.JSONObject(); o.put("n", c.getString(0)); o.put("t", c.getString(1)); a.put(o); }
                      } catch (Exception e) {}
                      return a.toString();
                  }
                  @JavascriptInterface public boolean agendar(String id, String titulo, double ini, double fim, String desc) {
                      if (checkSelfPermission(Manifest.permission.WRITE_CALENDAR) != PackageManager.PERMISSION_GRANTED) {
                          runOnUiThread(() -> requestPermissions(new String[]{Manifest.permission.READ_CALENDAR, Manifest.permission.WRITE_CALENDAR}, PEDIDO_INICIO));
                          return false;
                      }
                      try {
                          long cal = calendario();
                          if (cal < 0) return false;
                          SharedPreferences sp = getSharedPreferences("agenda", MODE_PRIVATE);
                          long ev = sp.getLong(id, -1);
                          ContentValues v = new ContentValues();
                          v.put(CalendarContract.Events.DTSTART, (long) ini);
                          v.put(CalendarContract.Events.DTEND, (long) fim);
                          v.put(CalendarContract.Events.TITLE, titulo);
                          v.put(CalendarContract.Events.DESCRIPTION, desc);
                          v.put(CalendarContract.Events.CALENDAR_ID, cal);
                          v.put(CalendarContract.Events.EVENT_TIMEZONE, java.util.TimeZone.getDefault().getID());
                          if (ev > 0 && getContentResolver().update(ContentUris.withAppendedId(CalendarContract.Events.CONTENT_URI, ev), v, null, null) > 0) return true;
                          Uri u = getContentResolver().insert(CalendarContract.Events.CONTENT_URI, v);
                          long nid = Long.parseLong(u.getLastPathSegment());
                          ContentValues r = new ContentValues();
                          r.put(CalendarContract.Reminders.EVENT_ID, nid);
                          r.put(CalendarContract.Reminders.MINUTES, 10);
                          r.put(CalendarContract.Reminders.METHOD, CalendarContract.Reminders.METHOD_ALERT);
                          getContentResolver().insert(CalendarContract.Reminders.CONTENT_URI, r);
                          sp.edit().putLong(id, nid).apply();
                          return true;
                      } catch (Exception e) { return false; }
                  }
                  @JavascriptInterface public void salvar(String nome, String conteudo) {
                      try {
                          String mime = "text/csv"; byte[] b;
                          if (conteudo.startsWith("data:")) { int k = conteudo.indexOf(','); int s = conteudo.indexOf(';'); if (s > 5 && s < k) mime = conteudo.substring(5, s); b = android.util.Base64.decode(conteudo.substring(k + 1), android.util.Base64.DEFAULT); }
                          else b = conteudo.getBytes(StandardCharsets.UTF_8);
                          if (Build.VERSION.SDK_INT >= 29) {
                              ContentValues cv = new ContentValues();
                              cv.put(MediaStore.Downloads.DISPLAY_NAME, nome);
                              cv.put(MediaStore.Downloads.MIME_TYPE, mime);
                              Uri uri = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, cv);
                              try (OutputStream o = getContentResolver().openOutputStream(uri)) { o.write(b); }
                          } else {
                              File f = new File(getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), nome);
                              try (FileOutputStream o = new FileOutputStream(f)) { o.write(b); }
                          }
                          aviso("Arquivo salvo em Downloads: " + nome);
                      } catch (Exception e) { aviso("Não foi possível salvar o arquivo"); }
                  }
              }

              @Override protected void onSaveInstanceState(Bundle s) { super.onSaveInstanceState(s); web.saveState(s); }
              @Override protected void onPause() { super.onPause(); web.onPause(); }
                            private boolean emLigacao = false; private Object ouvinte = null;
              private void vigiarLigacao() {
                  if (checkSelfPermission(Manifest.permission.READ_PHONE_STATE) != PackageManager.PERMISSION_GRANTED) { requestPermissions(new String[]{Manifest.permission.READ_PHONE_STATE}, PEDIDO_INICIO); return; }
                  final android.telephony.TelephonyManager tm = (android.telephony.TelephonyManager) getSystemService(TELEPHONY_SERVICE);
                  emLigacao = false; pararVigia();
                  try {
                      if (Build.VERSION.SDK_INT >= 31) {
                          class Cb extends android.telephony.TelephonyCallback implements android.telephony.TelephonyCallback.CallStateListener { public void onCallStateChanged(int st) { estadoLigacao(st); } }
                          Cb cb = new Cb(); ouvinte = cb; tm.registerTelephonyCallback(getMainExecutor(), cb);
                      } else {
                          android.telephony.PhoneStateListener l = new android.telephony.PhoneStateListener() { @Override public void onCallStateChanged(int st, String num) { estadoLigacao(st); } };
                          ouvinte = l; tm.listen(l, android.telephony.PhoneStateListener.LISTEN_CALL_STATE);
                      }
                  } catch (Exception e) {}
              }
              private void pararVigia() {
                  if (ouvinte == null) return;
                  android.telephony.TelephonyManager tm = (android.telephony.TelephonyManager) getSystemService(TELEPHONY_SERVICE);
                  try { if (Build.VERSION.SDK_INT >= 31) tm.unregisterTelephonyCallback((android.telephony.TelephonyCallback) ouvinte); else tm.listen((android.telephony.PhoneStateListener) ouvinte, 0); } catch (Exception e) {}
                  ouvinte = null;
              }
              private void estadoLigacao(int st) {
                  if (st == android.telephony.TelephonyManager.CALL_STATE_OFFHOOK) emLigacao = true;
                  else if (st == android.telephony.TelephonyManager.CALL_STATE_IDLE && emLigacao) { emLigacao = false; pararVigia(); runOnUiThread(this::voltarAoApp); }
              }
              private void voltarAoApp() {
                  Intent i = new Intent(this, MainActivity.class);
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_REORDER_TO_FRONT | Intent.FLAG_ACTIVITY_SINGLE_TOP);
                  try { startActivity(i); } catch (Exception e) {}
                  try { ((android.app.ActivityManager) getSystemService(ACTIVITY_SERVICE)).moveTaskToFront(getTaskId(), 0); } catch (Exception e) {}
                  try {
                      android.app.NotificationManager nm = (android.app.NotificationManager) getSystemService(NOTIFICATION_SERVICE);
                      if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(new android.app.NotificationChannel("ligacao", "Fim de ligação", android.app.NotificationManager.IMPORTANCE_HIGH));
                      android.app.PendingIntent pi = android.app.PendingIntent.getActivity(this, 1, i, android.app.PendingIntent.FLAG_IMMUTABLE | android.app.PendingIntent.FLAG_UPDATE_CURRENT);
                      android.app.Notification.Builder nb = Build.VERSION.SDK_INT >= 26 ? new android.app.Notification.Builder(this, "ligacao") : new android.app.Notification.Builder(this);
                      nb.setSmallIcon(getApplicationInfo().icon).setContentTitle("Ligação encerrada").setContentText("Toque para registrar o resultado").setContentIntent(pi).setAutoCancel(true);
                      nm.notify(77, nb.build());
                  } catch (Exception e) {}
              }
              @Override protected void onResume() { super.onResume(); web.onResume(); try { ((android.app.NotificationManager) getSystemService(NOTIFICATION_SERVICE)).cancel(77); } catch (Exception e) {} }
              @Override public void onBackPressed() { if (web.canGoBack()) web.goBack(); else super.onBackPressed(); }
          }
          EOF

          cat > $J/BuildConfigUrl.java <<EOF
          package br.com.rfi.discador;
          final class BuildConfigUrl { static final String URL = "${APP_URL}"; }
          EOF


      - name: Ícones (logo AGYWH DISCADOR, do site)
        run: |
          set -e
          pip install --quiet pillow
          curl -fsSL "${APP_URL}icon-512.png?v=${VERSION_CODE}" -o icone.png
          python3 -c "from PIL import Image;Image.open('icone.png').save('icone-loja-512.png')"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            mkdir -p projeto/app/src/main/res/mipmap-$n
            python3 -c "from PIL import Image;Image.open('icone.png').resize(($s,$s),Image.LANCZOS).save('projeto/app/src/main/res/mipmap-$n/ic_launcher.png')"
          done

      - name: Chave de teste fixa (para atualizar o app sem desinstalar)
        run: |
          set -e
          if [ ! -f chaves/teste.jks ]; then
            mkdir -p chaves
            keytool -genkeypair -v -keystore chaves/teste.jks -storepass discador-teste -keypass discador-teste \
              -alias teste -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Discador Teste, O=RFI, C=BR"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add chaves/teste.jks
            git commit -m "Chave de teste do APK [skip ci]"
            git push
          fi

      - name: Compilar APK
        run: |
          cd projeto
          gradle assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../AGYWH-DISCADOR-${VERSION_CODE}.apk

      - name: Compilar pacote da Play Store (AAB)
        if: env.TEM_CHAVE_LOJA == 'true'
        env:
          UPLOAD_PASS: ${{ secrets.UPLOAD_PASS }}
        run: |
          set -e
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          if [ ! -f chaves/upload.p12 ]; then
            mkdir -p chaves
            keytool -genkeypair -keystore chaves/upload.p12 -storetype PKCS12 -storepass "$UPLOAD_PASS" -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=AGYWH DISCADOR, O=Igor Oliveira, C=BR"
            git pull --rebase
            git add chaves/upload.p12
            git commit -m "Chave de upload da loja [skip ci]"
            git push
          fi
          export UPLOAD_JKS="$PWD/chaves/upload.p12" UPLOAD_ALIAS=upload
          cd projeto
          gradle bundleRelease --no-daemon
          cp app/build/outputs/bundle/release/app-release.aab ../AGYWH-DISCADOR-${VERSION_CODE}.aab

      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: AGYWH DISCADOR 1.0.${{ github.run_number }}
          body: "Baixe o arquivo .apk no celular Android e instale."
          files: |
            AGYWH-DISCADOR-*.apk
            AGYWH-DISCADOR-*.aab
            icone-loja-512.png
